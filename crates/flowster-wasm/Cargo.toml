[package]
name = "flowster-wasm"
description = "wasm-bindgen facade and worker protocol for the engine (SPEC §5.1, §5.4)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["spike"]
# M0 measurement hook: yrs alongside Loro for the CRDT spike.
spike = ["flowster-crdt/yrs"]

[dependencies]
flowster-core.workspace = true
flowster-vsdx.workspace = true
flowster-render.workspace = true
flowster-crdt = { workspace = true, features = ["loro"] }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
js-sys.workspace = true
serde-wasm-bindgen.workspace = true
console_error_panic_hook.workspace = true
dlmalloc = "0.2.14"

# This is an FFI crate: `unsafe` is allowed only in the allocator (src/wasm_alloc.rs).
[lints.rust]
unsafe_code = "deny"
