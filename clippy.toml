# Determinism (SPEC §20.3): derived state must be bit-identical on every peer,
# in WASM and native. Platform libm results differ in the last bits, so the std
# float methods that call into it are banned; use the `libm` crate instead.
disallowed-methods = [
    { path = "f64::sin", reason = "use libm::sin (SPEC §20.3)" },
    { path = "f64::cos", reason = "use libm::cos (SPEC §20.3)" },
    { path = "f64::tan", reason = "use libm::tan (SPEC §20.3)" },
    { path = "f64::sin_cos", reason = "use libm::sin + libm::cos (SPEC §20.3)" },
    { path = "f64::asin", reason = "use libm::asin (SPEC §20.3)" },
    { path = "f64::acos", reason = "use libm::acos (SPEC §20.3)" },
    { path = "f64::atan", reason = "use libm::atan (SPEC §20.3)" },
    { path = "f64::atan2", reason = "use libm::atan2 (SPEC §20.3)" },
    { path = "f64::exp", reason = "use libm::exp (SPEC §20.3)" },
    { path = "f64::ln", reason = "use libm::log (SPEC §20.3)" },
    { path = "f64::log10", reason = "use libm::log10 (SPEC §20.3)" },
    { path = "f64::log2", reason = "use libm::log2 (SPEC §20.3)" },
    { path = "f64::powf", reason = "use libm::pow (SPEC §20.3)" },
    { path = "f64::powi", reason = "platform-dependent; use libm::pow or explicit multiplication" },
    { path = "f64::hypot", reason = "use libm::hypot (SPEC §20.3)" },
    { path = "f64::cbrt", reason = "use libm::cbrt (SPEC §20.3)" },
    { path = "f64::mul_add", reason = "no FMA in derived state (SPEC §20.3)" },
]
