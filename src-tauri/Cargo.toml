[package]
name = "flowster-app"
description = "Flowster desktop host (SPEC §5.1, §21)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "flowster_app_lib"
crate-type = ["rlib"]

[[bin]]
name = "flowster-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-updater = "2"
serde.workspace = true
serde_json.workspace = true
# PDF export runs here, where the system fonts are (the WASM engine has none).
flowster-vsdx.workspace = true
flowster-render.workspace = true
flowster-text.workspace = true
flowster-export.workspace = true

# Settings > Open with Flowster asks LaunchServices (NSWorkspace) for the default app.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSBundle", "NSError", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "NSWorkspace"] }

[lints]
workspace = true
